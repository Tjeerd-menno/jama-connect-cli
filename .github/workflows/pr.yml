name: Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JamaConnect.slnx

      - name: Build
        run: dotnet build JamaConnect.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test JamaConnect.slnx --configuration Release --no-build --verbosity normal

  native-aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: jama-connect
          - os: windows-latest
            rid: win-x64
            executable: jama-connect.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish Native AOT
        shell: pwsh
        run: >
          dotnet publish src/JamaConnect.Cli/JamaConnect.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/native/${{ matrix.rid }}

      - name: Smoke test native executable
        shell: pwsh
        run: ./artifacts/native/${{ matrix.rid }}/${{ matrix.executable }} --help

